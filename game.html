<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/dialog.css">

    <script src="js/fruits.js" defer></script>
    <script src="js/game.js" defer></script>
</head>

<body>
    <div class="game-background">
        <img src="images/left-top.png" class="corner corner--top-left" alt="">
        <img src="images/right-top.png" class="corner corner--top-right" alt="">
        <img src="images/left-bottom.png" class="corner corner--bottom-left" alt="">
        <img src="images/right-bottom.png" class="corner corner--bottom-right" alt="">

        <main class="game-content">
            <h1>Cartas encontradas: <span id="pairs-found">0</span> / <span id="total-pairs"></span></h1>
            <div id="game-board"></div>
        </main>
    </div>

    <dialog id="gameover-dialog">
        <p>Você é ninja!</p>
        <button commandfor="gameover-dialog" command="close">Reiniciar jogo</button>
    </dialog>
</body>

</html>
